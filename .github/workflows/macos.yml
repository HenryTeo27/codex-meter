name: macOS build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m unittest -v test_macos test_sources test_speed_windows test_meter.DeltaTests test_meter.ParserTests
      - run: python scripts/build-macos.py
      - run: python scripts/smoke-macos.py
      - uses: actions/upload-artifact@v4
        with:
          name: Codex-Meter-macOS-${{ matrix.architecture }}
          path: release/Codex-Meter-macOS-*.zip
